# Scenario switches for the Solar Home Agent (Pakistan) v0 simulation.
# Every value here is an assumption or an approximation - see ASSUMPTIONS.md.

month: 2025-06

location:
  name: Islamabad
  latitude: 33.6844
  longitude: 73.0479
  timezone: Asia/Karachi

# The scenario reported in results/HEADLINE.md and opened by default in the app.
# A home that currently sits just over the 200-unit limit, unregistered and without
# a battery: the case where the tariff cliff actually bites.
main_scenario:
  has_battery: false
  export_mode: none
  household: at_risk

# Switches for a single run (the scenario matrix overrides these).
has_battery: false
export_mode: none        # none | net_billing | net_metering
household: at_risk       # low_use | at_risk | high_use
solar_kw: 5

# Daily outage windows as [start_hour, end_hour); [] means no power cuts.
power_cuts:
  - [20, 21]

# What the family actually needs during an outage: fans, lights, router.
# The AC and the flexible appliances do not run on backup.
power_cut_essential_load_kw: 0.30   # assumed

# Usual start hours in "usual" mode. Replace from survey results.
usual_times:
  water_motor: 19
  washing_machine: 18
  iron: 20

solar:
  derate: 0.80           # heat, dust and wiring losses

base_load_kw:            # fridge, fans, lights
  night: 0.30            # 00:00-06:00
  day: 0.40              # 06:00-18:00
  evening: 0.60          # 18:00-24:00

ac:
  kw_per_unit: 1.5
  temp_threshold_c: 30   # below this the AC is off
  full_duty_temp_c: 40   # at or above this the duty is 1.0
  day_window: [13, 18]   # half duty
  day_duty_factor: 0.5
  night_window: [18, 6]  # full duty, wraps past midnight

households:
  low_use:
    ac_count: 1
    load_scale: 1.0        # replaced by config/calibration.json when calibrated
    protected_eligible: true
  # A protected-eligible home that currently goes just over the 200-unit limit.
  # This is where the band-edge guard actually matters.
  at_risk:
    ac_count: 1
    load_scale: 1.0
    protected_eligible: true
  high_use:
    ac_count: 2
    load_scale: 1.0
    protected_eligible: false

appliances:
  water_motor:
    kw: 0.75
    hours: 1.0
    days_per_week: 7
    allowed: [8, 18]
  washing_machine:
    kw: 0.5
    hours: 1.0
    days_per_week: 4
    allowed: [9, 17]
  iron:
    kw: 1.0
    hours: 0.5
    days_per_week: 7
    allowed: [9, 18]

precooling:
  extra_kwh: 1.0
  evening_saving_kwh: 0.6      # ROUGH ESTIMATE, assumed - not measured
  window: [14, 17]
  trigger_evening_temp_c: 35

battery:
  capacity_kwh: 5.0
  max_charge_kw: 2.5
  max_discharge_kw: 2.5
  round_trip_efficiency: 0.90
  min_soc_frac: 0.20
  start_soc_frac: 0.50

agent:
  margin_percentile: 80
  min_history_days: 5          # before this, margin comes from cloud cover
  guard_threshold_units: 200   # the protected cliff, the most valuable edge to defend
  guard_all_band_edges: true   # also guard the other non-telescopic band edges
  guard_max_overshoot_frac: 0.20   # give up on an edge the month has already blown past
  guard_min_days: 10           # a projection from only a few days is far too unreliable
  # Share of days the family acts on the advice. Battery planning is automatic and
  # always applies; appliance timing and pre-cooling need someone to act.
  # Steps of 10%. Survey said about 80%; 70 is deliberately conservative.
  suggestions_followed_pct: 70

  # A home that already exports at 1:1, stores, and runs its flexible appliances by
  # day has nothing left for the agent to shift, so it stops making suggestions and
  # only holds a reserve for scheduled power cuts.
  stand_down:
    enabled: true
    daytime_window: [9, 17]   # usual start hours counted as "already in the sun"

tariff:
  # Protected: telescopic - each slice of units is charged at its own rate.
  protected_bands:             # [upper_unit_limit, Rs/unit]
    - [100, 10.54]
    - [200, 13.01]

  # Unprotected: NON-telescopic - the band the month reaches prices EVERY unit.
  # Reported S.R.O. 279(I)/2026. VERIFY AGAINST NEPRA before quoting any of these.
  unprotected_bands:           # [upper_unit_limit, Rs/unit]
    - [100, 22.44]
    - [200, 28.91]
    - [300, 33.10]
    - [400, 36.46]
    - [500, 38.95]
    - [600, 40.22]
    - [700, 41.85]
    - [999999, 47.20]

  # Fixed charge in Rs per kW of sanctioned load, one entry per band.
  # Reported S.R.O. 279(I)/2026. VERIFY AGAINST NEPRA before quoting.
  protected_fixed_charge_per_kw: [200, 300]                      # one per protected band
  fixed_charge_per_kw: [275, 300, 350, 400, 500, 675, 675, 675]  # one per unprotected band
  sanctioned_load_kw: 5        # assumed
  fixed_charge_applies_to_protected: true

  protected_limit_units: 200
  protected_status_months: 6   # months of unprotected pricing after crossing the limit
  taxes_multiplier: 1.0        # GST, duty, TV fee and fuel adjustments NOT included
  export_rate_net_billing: 11.0   # reported and contested

calibration:
  # Monthly grid units each profile's usual-mode baseline is calibrated to.
  # Both are ASSUMED. Update from a real bill and rerun with --calibrate.
  low_use_target_units: 175    # assumed midpoint of the 150-200 protected band
  at_risk_target_units: 215    # assumed: a home that crosses 200 by a little
